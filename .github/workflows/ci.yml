name: Project 04 firmware build and repository checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  firmware-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install PlatformIO
        run: pip install platformio
      - name: Compile ESP8266 NodeMCU firmware
        run: pio run -e nodemcuv2
      - name: Report verification boundary
        run: echo "Compilation does not verify PIR sensing, Wi-Fi, IFTTT delivery, or physical wiring."
