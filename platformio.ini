[platformio]
default_envs = nodemcuv2

[env:nodemcuv2]
platform = espressif8266
board = nodemcuv2
framework = arduino
monitor_speed = 115200
lib_deps =
  adafruit/Adafruit GFX Library
  adafruit/Adafruit SSD1306
build_flags =
  -D MQTT_ENABLED=0

[env:nodemcuv2-mqtt]
extends = env:nodemcuv2
build_flags =
  -D MQTT_ENABLED=1
lib_deps =
  ${env:nodemcuv2.lib_deps}
  knolleary/PubSubClient
